<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crudos Comprados — Detalle BPD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#EFF2F7;color:#1A1D29;min-height:100vh}
.pg{max-width:1100px;margin:0 auto;padding:28px 32px}

.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid #D4DAE5}
.hd-l{display:flex;align-items:center;gap:14px}
.hd h1{font-size:20px;font-weight:900;letter-spacing:-.5px}
.hd .badge{padding:7px 16px;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:.3px}
.hd .tabs{display:flex;gap:6px}
.tab{padding:8px 18px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;border:2px solid transparent;text-decoration:none}
.tab.f1{background:#EEEDFC;color:#5046E5;border-color:#C8C5F5}
.tab.f2{background:#FEF3E2;color:#C05E10;border-color:#F9D6A0}
.tab.active{box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateY(-1px)}
.tab:not(.active){opacity:.5}
.tab:not(.active):hover{opacity:.8}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:#FFF;border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-top:3px solid var(--sc)}
.stat-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#9CA3AF;margin-bottom:6px}
.stat-v{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:#1A1D29}
.stat-sub{font-size:10px;color:#9CA3AF;margin-top:4px;font-weight:500}

.pn{background:#FFF;border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:20px}
.pn-t{font-size:14px;font-weight:800;margin-bottom:4px}
.pn-sub{font-size:10px;color:#9CA3AF;margin-bottom:16px}

table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#9CA3AF;border-bottom:2px solid #E5E7EB;background:#F9FAFB}
th:first-child{text-align:left;border-radius:8px 0 0 0}
th:last-child{border-radius:0 8px 0 0}
th.avg{color:var(--fc)}
td{padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:#374151}
td:first-child{text-align:left;font-family:'DM Sans',sans-serif;font-weight:600;color:#4B5563;font-size:13px}
td.zero{color:#D1D5DB}
tr{border-bottom:1px solid #F3F4F6;transition:background .15s}
tr:hover{background:#FAFBFD}
tr.total{border-top:2px solid #D1D5DB;background:#F3F4F6}
tr.total td{font-weight:800;color:#1A1D29;font-size:14px}
td.avg-col{font-weight:800;color:var(--fc)}

.chart-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.chart-card{background:#FFF;border-radius:12px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.04);text-align:center}
.chart-card h3{font-size:12px;font-weight:800;color:#1A1D29;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:100px;justify-content:center}
.bar{width:18px;border-radius:4px 4px 0 0;background:var(--bg);min-height:3px;position:relative;transition:all .3s}
.bar:hover{filter:brightness(1.1)}
.bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:7px;color:#9CA3AF;white-space:nowrap}

.ft{text-align:center;margin-top:28px;font-size:10px;color:#9CA3AF}
.ft b{color:var(--fc)}
</style>
</head>
<body>
<div class="pg" id="app"></div>

<script>
// ═══ DATOS CRUDOS ═══
const DATA = {
  F1: {
    label: "F1 6+6",
    color: "#5046E5",
    bg: "#EEEDFC",
    border: "#C8C5F5",
    gradient: "linear-gradient(180deg,#818CF8,#5046E5)",
    crudos: [
      { name: "Tapir Petrolco",   sep: 0,    oct: 850,  nov: 850,  dic: 850  },
      { name: "Mezcla Perenco",   sep: 1361, oct: 2147, nov: 2186, dic: 2222 },
      { name: "Yamú",             sep: 0,    oct: 240,  nov: 240,  dic: 240  },
      { name: "Carrizales Norte", sep: 200,  oct: 200,  nov: 200,  dic: 200  },
      { name: "Mauritia",         sep: 430,  oct: 430,  nov: 430,  dic: 430  },
      { name: "Campechana",       sep: 1150, oct: 1150, nov: 1150, dic: 1150 },
      { name: "Tapir Samaria",    sep: 900,  oct: 900,  nov: 900,  dic: 900  }
    ]
  },
  F2: {
    label: "F2 7+5",
    color: "#EA580C",
    bg: "#FEF3E2",
    border: "#F9D6A0",
    gradient: "linear-gradient(180deg,#FDBA74,#EA580C)",
    crudos: [
      { name: "Tapir Petrolco",   sep: 850,  oct: 637,  nov: 550,  dic: 550  },
      { name: "Mezcla Perenco",   sep: 850,  oct: 637,  nov: 2135, dic: 2135 },
      { name: "Yamú",             sep: 0,    oct: 0,    nov: 0,    dic: 0    },
      { name: "Parex Coveñas",    sep: 10000,oct: 8100, nov: 0,    dic: 0    },
      { name: "Carrizales Norte", sep: 0,    oct: 0,    nov: 0,    dic: 0    },
      { name: "Mauritia",         sep: 164,  oct: 218,  nov: 307,  dic: 307  },
      { name: "Campechana",       sep: 372,  oct: 1463, nov: 1435, dic: 1468 },
      { name: "Tapir Samaria",    sep: 315,  oct: 419,  nov: 591,  dic: 591  }
    ]
  }
};

function getParam() {
  const p = new URLSearchParams(window.location.search);
  return p.get("forecast") === "F1" ? "F1" : "F2";
}

function fmt(n) { return n.toLocaleString("es-CO"); }

function render(fc) {
  const d = DATA[fc];
  const other = fc === "F1" ? "F2" : "F1";
  const crudos = d.crudos.filter(c => c.sep + c.oct + c.nov + c.dic > 0);
  
  const totS = d.crudos.reduce((s,c) => s+c.sep, 0);
  const totO = d.crudos.reduce((s,c) => s+c.oct, 0);
  const totN = d.crudos.reduce((s,c) => s+c.nov, 0);
  const totD = d.crudos.reduce((s,c) => s+c.dic, 0);
  const totAll = totS + totO + totN + totD;
  const avgAll = Math.round(totAll / 4);

  document.documentElement.style.setProperty('--fc', d.color);
  document.documentElement.style.setProperty('--bg', d.gradient);

  const maxBar = Math.max(totS, totO, totN, totD);

  let rows = crudos.map(c => {
    const avg = Math.round((c.sep+c.oct+c.nov+c.dic)/4);
    const cell = v => v === 0 ? "<td class='zero'>—</td>" : `<td>${fmt(v)}</td>`;
    return `<tr><td>${c.name}</td>${cell(c.sep)}${cell(c.oct)}${cell(c.nov)}${cell(c.dic)}<td class='avg-col'>${fmt(avg)}</td></tr>`;
  }).join("");

  const urlOther = `?forecast=${other}`;

  document.getElementById("app").innerHTML = `
    <div class="hd">
      <div class="hd-l">
        <h1>Crudos Comprados — BPD/Día</h1>
      </div>
      <div class="tabs">
        <a href="?forecast=F1" class="tab f1 ${fc==='F1'?'active':''}">F1 6+6</a>
        <a href="?forecast=F2" class="tab f2 ${fc==='F2'?'active':''}">F2 7+5</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat" style="--sc:${d.color}"><div class="stat-l">Total Sep–Dic</div><div class="stat-v">${fmt(totAll)}</div><div class="stat-sub">BPD acumulado</div></div>
      <div class="stat" style="--sc:${d.color}"><div class="stat-l">Promedio Mensual</div><div class="stat-v">${fmt(avgAll)}</div><div class="stat-sub">BPD/día promedio</div></div>
      <div class="stat" style="--sc:${d.color}"><div class="stat-l">Crudos Activos</div><div class="stat-v">${crudos.length}</div><div class="stat-sub">con volumen > 0</div></div>
      <div class="stat" style="--sc:${d.color}"><div class="stat-l">Forecast</div><div class="stat-v">${d.label}</div><div class="stat-sub">Presupuesto vigente</div></div>
    </div>

    <div class="chart-row">
      <div class="chart-card"><h3>Sep</h3><div class="bar-chart">${crudos.map(c => {
        const h = maxBar > 0 ? (c.sep/maxBar*80) : 0;
        return `<div class="bar" style="height:${Math.max(h,2)}px" title="${c.name}: ${fmt(c.sep)}"><div class="bar-val">${c.sep>0?fmt(c.sep):''}</div></div>`;
      }).join("")}</div></div>
      <div class="chart-card"><h3>Oct</h3><div class="bar-chart">${crudos.map(c => {
        const h = maxBar > 0 ? (c.oct/maxBar*80) : 0;
        return `<div class="bar" style="height:${Math.max(h,2)}px" title="${c.name}: ${fmt(c.oct)}"><div class="bar-val">${c.oct>0?fmt(c.oct):''}</div></div>`;
      }).join("")}</div></div>
      <div class="chart-card"><h3>Nov</h3><div class="bar-chart">${crudos.map(c => {
        const h = maxBar > 0 ? (c.nov/maxBar*80) : 0;
        return `<div class="bar" style="height:${Math.max(h,2)}px" title="${c.name}: ${fmt(c.nov)}"><div class="bar-val">${c.nov>0?fmt(c.nov):''}</div></div>`;
      }).join("")}</div></div>
      <div class="chart-card"><h3>Dic</h3><div class="bar-chart">${crudos.map(c => {
        const h = maxBar > 0 ? (c.dic/maxBar*80) : 0;
        return `<div class="bar" style="height:${Math.max(h,2)}px" title="${c.name}: ${fmt(c.dic)}"><div class="bar-val">${c.dic>0?fmt(c.dic):''}</div></div>`;
      }).join("")}</div></div>
    </div>

    <div class="pn">
      <div class="pn-t">Detalle BPD por Crudo — ${d.label}</div>
      <div class="pn-sub">Barriles por día · Sep a Dic 2026</div>
      <table>
        <thead><tr><th>Crudo</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dic</th><th class="avg">Promedio</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="total"><td>TOTAL</td><td>${fmt(totS)}</td><td>${fmt(totO)}</td><td>${fmt(totN)}</td><td>${fmt(totD)}</td><td class="avg-col">${fmt(avgAll)}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="ft">Frontera Energy · Crudos Comprados 2026 · <b>${d.label}</b></div>
  `;
}

render(getParam());
</script>
</body>
</html>
